name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libffi-dev python3-dev cython3 libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-mixer-dev
          pip install --upgrade buildozer "Cython<3.0"

      - name: Generate Spec File
        run: |
          buildozer init
          cat << 'EOF' > buildozer.spec
          [app]
          title = Mafia Game
          package.name = mafiagame
          package.domain = org.test
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 0.1
          requirements = python3,pygame,arabic-reshaper,python-bidi
          orientation = portrait
          osx.python_version = 3
          osx.kivy_version = 1.9.1
          fullscreen = 0
          android.archs = arm64-v8a
          android.allow_backup = True
          android.accept_sdk_license = True
          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF

      - name: Build APK with Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: bin/*.apk
