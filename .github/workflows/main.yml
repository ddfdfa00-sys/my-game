name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libffi-dev python3-dev cython3 libsdl2-dev zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake
          pip install --upgrade pip
          pip install --upgrade "buildozer" "Cython<3.0"

      - name: Build APK with Buildozer
        run: |
          buildozer init
          cat << 'EOF' > buildozer.spec
          [app]
          title = Mafia Game
          package.name = mafiagame
          package.domain = org.mafia
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 0.1
          requirements = python3==3.10.12,kivy
          orientation = portrait
          fullscreen = 0
          android.archs = arm64-v8a
          android.allow_backup = True
          android.accept_sdk_license = True
          android.skip_update = False
          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: bin/*.apk
